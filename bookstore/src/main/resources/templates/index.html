<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
  <head>
    <title>Bookstore</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
  </head>
  <body>
    <nav class="mt-3 mx-5 d-flex justify-content-end align-items-center">
            <a href="/index" class="px-2 active link-secondary link-offset-2 link-underline-success">Home</a>
            <a href="/booklist" class="px-2 link-secondary link-underline link-underline-opacity-0">Books</a>
             <form th:action="@{/logout}" method="post" class="px-3 d-flex align-items-center">
                <span sec:authentication="name" class="px-2 text-capitalize"></span>
                <input class="btn btn-outline-secondary" type="submit" value="Sign Out"/>
            </form>
    </nav>

    <div class="container my-5 text-center ">
      <h1 sec:authorize="hasRole ('ADMIN')" class="display-4 mb-4">Hello, <span sec:authentication="name" class="text-capitalize"></span>!</h1>
      <h1 sec:authorize="hasRole ('USER')"class="display-4 mb-4">Welcome to the Bookstore, </br> <span sec:authentication="name" class="text-capitalize"></span>!</h1>
      <div class="d-grid gap-3 col-6 col-md-4 mx-auto pt-3">
        <a href="/booklist" class="btn btn-success text-nowrap px-4 mx-3">See all books</a>
        <a sec:authorize="hasRole ('ADMIN')" href="/addbook" class="btn btn-success text-nowrap px-4 mx-3">Add a new book</a>
      </div>
    </div>
    
  </body>
</html>
