<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Add a book</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
  </head>
  <body>
    <nav class="mt-3 mx-5 d-flex justify-content-end">
            <a href="/index " class="px-2 link-secondary link-underline link-underline-opacity-0">Home</a>
            <a href="/booklist" class="px-2 link-secondary link-underline link-underline-opacity-0">Books</a>
    </nav>
    <div class="container mx-auto my-5" style="width: 500px;">
        <h1 class="mb-5 text-center display-4">Add a book</h1>
        <form class="" th:object="${book}" th:action="@{saveandvalidate}" action="#" method="post">
            <div class="mb-3">
                <label class="form-label" for="title">Title: </label>
                <input class="form-control" type="text" id="title" th:field="*{title}" />
                <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-danger" >Error</span>
            </div>
            <div class="mb-3">
                <label class="form-label" for="author">Author: </label>
                <input class="form-control" type="text" id="author" th:field="*{author}" />
                <span th:if="${#fields.hasErrors('author')}" th:errors="*{author}" class="text-danger" >Error</span>
            </div>
            <div class="mb-3">
                <label class="form-label" for="publicationYear">Publ. year: </label>
                <input class="form-control" type="number" id="publicationYear" th:field="*{publicationYear}" />
                <span th:if="${#fields.hasErrors('publicationYear')}" th:errors="*{publicationYear}" class="text-danger" >Error</span>
            </div>
            <div class="mb-3">
                <label class="form-label" for="isbn">ISBN: </label>
                <input class="form-control" type="text" id="isbn" th:field="*{isbn}" />
                <span th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}" class="text-danger" >Error</span>
            </div>
            <div class="mb-3">
                <label class="form-label" for="price">Price: </label>
                <input class="form-control" type="number" id="price" th:field="*{price}" step="0.01" />
                <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-danger" >Error</span>
            </div>
            <div>
                <label for="categorylist">Category</label>
                <select id="categorylist" th:field="*{category}" class="form-select">
                    <option th:value="null"></option>
                    <option th:each="category: ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}">
                    </option>
                </select>
                <span th:if="${#fields.hasErrors('category')}" th:errors="*{category}" class="text-danger">Error</span>
            </div>
            <div class="mt-4 col-12 d-flex justify-content-end">
                <input type="submit" value="Save" class="btn btn-success px-4"></input>
            </div>
        </form>
    </div>  
  </body>
</html>
