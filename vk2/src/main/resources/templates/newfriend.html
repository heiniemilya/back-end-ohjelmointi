<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Add new friends</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  </head>
  <body>
    <h1>Add new friend to list</h1>

    <form action="#" th:action="@{/addfriend}" th:object="${friend}" method="post">
        <table>
            <tr>
                <td>
                    <p>First name: <input type="text" th:field="*{firstName}" /></p>
                </td>
                <td>
                    <p>Last name: <input type="text" th:field="*{lastName}" /></p>
                </td>
                <td>
                    <p><input type="submit" value="Add friend" /></p>
                </td>
            </tr>
        </table>
    </form>
  
  </body>
</html>
