<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
  <head>
    <title>Huoltovahti - Muokka huoltotyötä</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>
  <body>
    <div class="container my-5">

        <div class="mb-5 d-flex justify-content-between align-items-end">
            <a th:href="@{/index}" class="text-decoration-none text-dark fs-2 fw-bold">
                Huolto<span class="text-primary fw-normal">vahti</span>
            </a>
        </div>

        <!-------- FORM --------->
        <div class="bg-light shadow-sm rounded-4 container mx-auto my-5 p-4" style="width: 700px;">
            <div class="d-flex justify-content-between ">
                <h1 class="mb-4 fs-4 text-primary">Muokkaa huoltotyötä</h1>
                <i><a th:href="@{/delete/{id}(id=*{id})}" class="bi bi-trash3-fill text-primary fs-5" title="Poista"></a></i>
            </div>

            <form class="row" th:object="${taskToEdit}" th:action="@{/saveEditedTask}" action="#" method="post">
                <!-- ID field hidden-->
                <input type="hidden" th:field="*{id}" />
                <!--Targets-->
                <div class="col-md-12 mb-3">
                    <label class="form-label" for="targetlist">Kohteet:</label>
                    <div class="d-flex gap-3 p-2">
                        <div th:each="target : ${targets}" class="form-check">
                            <input class="form-check-input" 
                                type="checkbox" 
                                th:field="*{targets}" 
                                th:value="${target.id}" 
                                th:id="${'target-' + target.id}" />
                            <label class="form-check-label" 
                                th:for="${'target-' + target.id}" 
                                th:text="${target.name}">
                            </label>
                        </div>
                    </div>
                    <span th:if="${#fields.hasErrors('targets')}" th:errors="*{targets}" class="text-danger small mt-1">Error</span>
                </div>

                <!--Title-->
                <div class="col-md-7 mb-3">
                    <label class="form-label" for="title">Otsikko: </label>
                    <input class="form-control" type="text" id="title" th:field="*{title}" />
                    <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-danger small mt-1" >Error</span>
                </div>

                <!--Category-->
                <div class="col-md-5 mb-3">
                    <label class="form-label" for="categorylist">Kategoria:</label>
                    <select id="categorylist" th:field="*{category}" class="form-select">
                        <option th:value="null">Valitse kategoria</option>
                        <option th:each="category: ${categories}"
                            th:value="${category.id}"
                            th:text="${category.name}">
                        </option>
                    </select>
                    <span th:if="${#fields.hasErrors('category')}" th:errors="*{category}" class="text-danger small mt-1">Error</span>
                </div>

                 <!--Responsibility-->
                <div class="col-md-5 mb-3 pt-2">
                    <label class="form-label d-block">Kunnossapitovastuu:</label>
                    <div class="form-check form-check-inline m-2">
                        <input class="form-check-input" type="radio" th:field="*{responsibility}" id="shareholder" value="Osakas">
                        <label class="form-check-label" for="shareholder">Osakas</label>
                    </div>
                    <div class="form-check form-check-inline m-2">
                        <input class="form-check-input" type="radio" th:field="*{responsibility}" id="company" value="Taloyhtiö">
                        <label class="form-check-label" for="company">Taloyhtiö</label>
                    </div>
                    <div th:if="${#fields.hasErrors('responsibility')}" th:errors="*{responsibility}" class="text-danger small mt-1"></div>
                </div>

                <!--Paid by-->
                <div class="col-md-7 mb-3 pt-2">
                    <label class="form-label d-block">Taloyhtiön rahoittama:</label>
                     <div class="form-check form-check-inline m-2">
                        <input class="form-check-input" type="radio" th:field="*{isPaidByCompany}" id="notpaid" value="false">
                        <label class="form-check-label" for="notpaid">Ei</label>
                    </div>
                    <div class="form-check form-check-inline m-2">
                        <input class="form-check-input" type="radio" th:field="*{isPaidByCompany}" id="paid" value="true">
                        <label class="form-check-label" for="paid">Kyllä</label>
                    </div>
                    <div th:if="${#fields.hasErrors('isPaidByCompany')}" th:errors="*{isPaidByCompany}" class="text-danger small mt-1"></div>
                </div>

                <!--Description-->
                <div class="mb-3">
                    <label class="form-label" for="description">Kuvaus: </label>
                    <textarea class="form-control" type="text" id="descriptionr" th:field="*{description}" rows="3"></textarea>
                    <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-danger" >Error</span>
                </div>

                <!--Year-->
                <div class="col-md-4 mb-3">
                    <label class="form-label" for="taskYear">Valmistumisvuosi: </label>
                    <input class="form-control" type="number" id="taskYear" th:field="*{taskYear}" />
                    <span th:if="${#fields.hasErrors('taskYear')}" th:errors="*{taskYear}" class="text-danger small mt-1" >Error</span>
                </div>

                <!--Timeframe-->
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="timeframe">Ajankohta: </label>
                    <input class="form-control" type="text" id="timeframe" placeholder="esim. heinäkuu" th:field="*{timeframe}" />
                    <span th:if="${#fields.hasErrors('timeframe')}" th:errors="*{timeframe}" class="text-danger small mt-1" >Error</span>
                </div>

                <!--Performed by-->
                <div class="col-md-12 mb-3 pt-2">
                    <label class="form-label d-block">Työn suorittaja:</label>
                    <div class="form-check form-check-inline m-2">
                        <input class="form-check-input" type="radio" th:field="*{isSelfPerformed}" id="diy" value="true">
                        <label class="form-check-label" for="diy">Tehty itse</label>
                    </div>
                    <div class="form-check form-check-inline m-2">
                        <input class="form-check-input" type="radio" th:field="*{isSelfPerformed}" id="contractor" value="false">
                        <label class="form-check-label" for="contractor">Käytetty urakoitsijaa</label>
                    </div>
                    <div th:if="${#fields.hasErrors('isSelfPerformed')}" th:errors="*{isSelfPerformed}" class="text-danger small mt-1"></div>
                </div>

                <!--Buttons-->
                <div class="mt-4 col-12 d-flex justify-content-end gap-2">
                    <a class="btn btn-outline-secondary" href="/index" role="button">Peruuta</a>
                    <input type="submit" value="Tallenna" class="btn btn-primary px-4"></input>
                </div>
            </form>
        </div>  
    </div>
    
  </body>
</html>
