<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
  <head>
    <title>Huoltovahti</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>
  <body>

    <!--Nav from fragments-->
    <div th:replace="~{fragments :: navbar}"></div>

    <div class="container my-5">
        <div class="row g-4">
            <!-------- MAINTENANCE HISTORY --------->
            <div class="col-xl-8"> 
                <div class="ps-2">
                    <h1 class="text-secondary fw-light fs-4">Viimeisimmät huoltotyöt</h1>
                </div>
               
                <!-------- MAINTENANCE TASK TABLE --------->
                <div class="table-responsive rounded-4 overflow-x-auto shadow-sm">
                    <table class="table table-hover table-borderless mb-0 ">
                        <thead>
                            <tr class="table-primary align-middle small">
                                <th class="ps-3">Ajankohta</th>
                                <th>Kohde</th>
                                <th>Huoltotyö</th>
                                <th>Työn suorittaja</th>
                                <th>Vastuu</th>
                                <th>Yhtiön rahoitus</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each = "task : ${tasks}" class="border-bottom align-middle table-light">
                                <!-- Year & Timeframe -->
                                <td class="ps-3">
                                    <div th:text="${task.taskYear}" class="fw-bold"></div>
                                    <div th:text="${task.timeframe}"></div>
                                </td>
                                <!-- Target -->
                                <td>
                                    <span th:each="target : ${task.targets}">
                                        <a th:href="@{/target/{id}/tasks(id=${target.id})}" 
                                        class="badge bg-primary text-light text-decoration-none" 
                                        th:text="${target.name}"></a>
                                    </span>
                                </td>
                                <!-- Title & Description -->
                                <td>
                                    <div th:text="${task.title}" class="fw-bold"></div>
                                    <div th:text="${task.description}"></div>
                                </td>
                                <!-- Contractor -->
                                <td>
                                    <div th:text="${task.contractor}"></div>
                                    <div th:text="${task.contractorBusinessId}" class="text-secondary"></div>
                                    <div th:if="${task.isSelfPerformed}">Tehty itse</div>  
                                </td>
                                <!-- Responsibility -->
                                <td th:text="${task.responsibility}"></td>
                                <!-- Paid by Company -->
                                <td class="text-center">
                                    <i th:if="${task.isPaidByCompany}" class="bi bi-check-circle-fill text-success"></i>
                                    <i th:unless="${task.isPaidByCompany}" class="bi bi-dash text-muted fs-5"></i>
                                </td>
                                <!-- Edit -->
                                <td>
                                    <i><a th:if="${#authorization.expression('hasRole(''ADMIN'')') or (task.createdBy != null and task.createdBy.username == #authentication.name)}"
                                        th:href="@{/edit/{id}(id=${task.id})}" class="bi bi-pencil-square text-primary fs-5 pe-2" title="Muokkaa"></a></i>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-------- PLANNED MAINTENANCE TASKS TABLE --------->
            <div class="col-xl-4">
                <h1 class="ps-2 text-secondary fw-light fs-4">Kunnossapitosuunnitelma</h1>
                <div class="table-responsive rounded-4 overflow-x-auto shadow-sm">
                    <table class="table table-hover table-borderless mb-0 ">
                        <thead>
                            <tr class="table-primary align-middle small">
                                <th class="ps-3">Ajankohta</th>
                                <th>Huoltotyö</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each = "task : ${plannedTasks}" class="border-bottom align-middle table-light">
                                <!-- Year & Timeframe -->
                                <td class="ps-3">
                                    <div th:text="${task.taskYear}" class="fw-bold"></div>
                                    <div th:text="${task.timeframe}"></div>
                                </td>
                                <!-- Title & Description -->
                                <td>
                                    <div th:text="${task.title}" class="fw-bold"></div>
                                    <div th:text="${task.description}"></div>
                                </td>
                                <!-- Edit -->
                                <td>
                                    <i><a sec:authorize="hasAuthority ('ADMIN')" th:href="@{/edit/{id}(id=${task.id})}" class="bi bi-pencil-square text-primary fs-5" title="Muokkaa"></a></i>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>        

     </div>
    
  </body>
</html>
