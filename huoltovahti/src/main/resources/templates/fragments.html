<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    
    <!-------- Navbar -------->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg bg-light shadow-sm py-2 px-3">
        <div class="container-fluid">
            <!-- Logo -->
            <a th:href="@{/index}" class="navbar-brand text-dark fs-2 fw-bold me-4">
                Huolto<span class="text-primary fw-normal">vahti</span>
            </a>

            <!-- Hamburger button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Avaa valikko">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Collapsing menu -->
            <div class="collapse navbar-collapse" id="navbarContent">
                <!-- Links -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-lg-1 text-center">
                    <li class="nav-item">
                        <a th:href="@{/index}" class="nav-link text-nowrap px-3">Etusivu</a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/maintenanceTaskHistory}" class="nav-link text-nowrap px-3">Kunnossapitohistoria</a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/myMaintenanceTasks}" class="nav-link text-nowrap px-3">Omat huoltotyöt</a>
                    </li>
                </ul>

                <!-- Add Task buttons in hamburger (only in mobile) -->
                <div class="d-flex flex-column gap-2 mb-3 d-lg-none align-items-center">
                    <a th:href="@{/addMaintenanceTask(planned=false)}" class="btn btn-primary text-nowrap rounded-4">
                        <i class="bi-plus-lg"></i> Huoltotyö
                    </a>
                    <a th:href="@{/addMaintenanceTask(planned=true)}" class="btn btn-primary text-nowrap rounded-4">
                        <i class="bi-plus-lg"></i> Suunniteltu huoltotyö
                    </a>
                </div>

                <!-- Logout -->
                <hr class="d-lg-none my-2 text-secondary">
                <form th:action="@{/logout}" method="post" class="d-flex align-items-center gap-2 py-2 py-lg-0 justify-content-center">
                    <span class="text-secondary text-nowrap">Hei <span sec:authentication="name" class="text-capitalize text-secondary"></span>!</span>
                    <input class="btn btn-outline-secondary rounded-4" type="submit" value="Kirjaudu ulos"/>
                </form>
            </div>
        </div>

        <!-- Floating Add Task buttons (only on bigger screens, d-none d-lg-flex) -->
        <div class="position-fixed bottom-0 end-0 p-5 d-none d-lg-flex flex-column gap-2" style="z-index: 1050;">
            <a th:href="@{/addMaintenanceTask(planned=false)}" class="btn btn-primary text-nowrap px-3 rounded-4 shadow-sm">
                <i class="bi-plus-lg"></i> Huoltotyö
            </a>
            <a th:href="@{/addMaintenanceTask(planned=true)}" class="btn btn-primary text-nowrap px-3 rounded-4 shadow-sm">
                <i class="bi-plus-lg"></i> Suunniteltu huoltotyö
            </a>
        </div>

        <!-- Bootstrap JS for hamburger -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </nav>

</body>
</html>
